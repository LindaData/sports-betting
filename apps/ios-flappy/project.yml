# Fallback project generator. Only needed if the checked-in .xcodeproj ever
# goes stale or you want to regenerate it from scratch:
#
#   brew install xcodegen
#   cd apps/ios-flappy && xcodegen generate
#
name: PitchFlap
options:
  bundleIdPrefix: com.lindadata
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PitchFlap:
    type: application
    platform: iOS
    sources:
      - PitchFlap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lindadata.pitchflap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Pitch Flap
        INFOPLIST_KEY_UIStatusBarHidden: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
