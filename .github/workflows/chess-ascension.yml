name: Chess Ascension CI

on:
  pull_request:
    paths:
      - "apps/chess-ascension/**"
      - ".github/workflows/chess-ascension.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/chess-ascension/**"
      - ".github/workflows/chess-ascension.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chess-ascension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chess-ascension/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
